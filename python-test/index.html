<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>HDBSCAN Cluster Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    svg {
      border: 1px solid #ccc;
    }

    #controls {
      margin-bottom: 1em;
    }

    .point {
      stroke: #333;
      cursor: pointer;
    }

    .selected {
      stroke: black;
    }
  </style>
</head>

<body>
  <h2>HDBSCAN Cluster Explorer</h2>

  <div id="controls">
    <label>Water Level (λ threshold):
      <input id="lambda" type="range" min="0" max="10" step="0.1" value="3">
      <span id="lambdaVal">3</span>
    </label>
    <br><br>
    <label>
      <input id="autoSelect" type="checkbox"> Auto-select threshold (click finds optimal λ level)
    </label>
    <br><br>
    <label>
      <input id="expandSelection" type="checkbox" disabled> Expand selection (click any selected point to drill deeper)
    </label>
    <br><br>
    <div id="selectionInfo" style="font-weight: bold; color: #333;">
      Selected points: <span id="selectedCount">0 / 0</span>
    </div>
  </div>

  <svg id="plot" width="600" height="400"></svg>

  <script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    const svg = d3.select("#plot");
    const width = +svg.attr("width");
    const height = +svg.attr("height");

    // Create a group for zoomable content
    const g = svg.append("g");

    const color = d3.scaleOrdinal(d3.schemeTableau10);
    const lambdaInput = document.getElementById("lambda");
    const lambdaVal = document.getElementById("lambdaVal");
    const autoSelectCheckbox = document.getElementById("autoSelect");
    const expandSelectionCheckbox = document.getElementById("expandSelection");

    let points = [];
    let labelsByThreshold = {};
    let currentLambda = parseFloat(lambdaInput.value);
    let autoSelectMode = false;
    let expandSelectionMode = false;
    let lastSelectedPoint = null; // Track the last selected point for progressive drilling

    // Set up zoom behavior
    const zoom = d3.zoom()
      .scaleExtent([0.1, 10])
      .on("zoom", (event) => {
        g.attr("transform", event.transform);

        // Keep dots and borders the same size by adjusting inversely to zoom scale
        g.selectAll("circle")
          .attr("r", 4 / event.transform.k)
          .attr("stroke-width", function (d, i) {
            // Get current labels to check if point is noise
            const threshold = nearestThreshold(currentLambda);
            const labels = labelsByThreshold[threshold];
            const isNoise = labels && labels[i] === -1;

            // No stroke for noise points, different stroke width for selected vs normal dots
            if (isNoise) return 0;
            return d3.select(this).classed("selected") ?
              2 / event.transform.k :
              1 / event.transform.k;
          });
      });

    svg.call(zoom);

    // Add click handler to SVG for background clicks
    svg.on("click", function (event) {
      // Check if the click target is the SVG itself (background) or the zoomable group
      if (event.target === this || event.target === g.node()) {
        handleBackgroundClick();
      }
    });

    function handleBackgroundClick() {
      console.log("Clicked on background - resetting selection and going to lowest water level");

      // Clear any current selection
      g.selectAll("circle")
        .classed("selected", false)
        .attr("stroke-width", function (d, i) {
          const currentTransform = d3.zoomTransform(svg.node());
          // Get current labels to check if point is noise
          const threshold = nearestThreshold(currentLambda);
          const labels = labelsByThreshold[threshold];
          const isNoise = labels && labels[i] === -1;

          // No stroke for noise points
          return isNoise ? 0 : 1 / currentTransform.k;
        });

      // Update selection count
      updateSelectionCount(0);

      // Reset tracking
      lastSelectedPoint = null;

      // Find the lowest lambda value available
      if (Object.keys(labelsByThreshold).length > 0) {
        const thresholds = Object.keys(labelsByThreshold).map(parseFloat);
        const lowestLambda = Math.min(...thresholds);

        // Update the slider and current lambda to lowest value
        currentLambda = lowestLambda;
        lambdaInput.value = currentLambda;
        lambdaVal.textContent = currentLambda.toFixed(1);

        // Manually recolor points since recolorPoints might not be defined yet
        const threshold = nearestThreshold(currentLambda);
        const labels = labelsByThreshold[threshold];
        g.selectAll("circle")
          .attr("fill", (d, i) => {
            const label = labels[i];
            // Make noise points (label -1) gray and semi-transparent
            if (label === -1) {
              return "#cccccc";
            }
            return color(label);
          })
          .attr("opacity", (d, i) => {
            const label = labels[i];
            // Make noise points more transparent
            return label === -1 ? 0.4 : 1.0;
          })
          .attr("stroke-width", function (d, i) {
            const currentTransform = d3.zoomTransform(svg.node());
            const label = labels[i];
            const isNoise = label === -1;

            // No stroke for noise points
            if (isNoise) return 0;
            return d3.select(this).classed("selected") ?
              2 / currentTransform.k :
              1 / currentTransform.k;
          });
      }
    }

    function nearestThreshold(val) {
      const keys = Object.keys(labelsByThreshold).map(parseFloat);
      const closest = keys.reduce((a, b) => Math.abs(a - val) < Math.abs(b - val) ? a : b);
      return closest.toFixed(2);
    }

    function updateSelectionCount(count) {
      const selectedCountElement = document.getElementById("selectedCount");
      if (selectedCountElement) {
        const total = points.length;
        const percentage = total > 0 ? Math.round((count / total) * 100) : 0;
        selectedCountElement.textContent = `${count} / ${total} (${percentage}%)`;
      }
    }

    Promise.all([
      d3.json("out/points_with_labels.json"),
      d3.json("out/labels_by_threshold.json")
    ]).then(([pts, lbls]) => {
      points = pts;
      labelsByThreshold = lbls;

      const xExtent = d3.extent(points, d => d.x);
      const yExtent = d3.extent(points, d => d.y);

      const xScale = d3.scaleLinear().domain(xExtent).range([40, width - 40]);
      const yScale = d3.scaleLinear().domain(yExtent).range([height - 40, 40]);

      // Draw points in the zoomable group
      g.selectAll("circle")
        .data(points)
        .enter()
        .append("circle")
        .attr("class", "point")
        .attr("r", 4)
        .attr("stroke-width", function (d, i) {
          // Initial stroke width - no stroke for noise points
          const threshold = nearestThreshold(currentLambda);
          const labels = labelsByThreshold[threshold];
          const isNoise = labels && labels[i] === -1;
          return isNoise ? 0 : 1;
        })
        .attr("cx", d => xScale(d.x))
        .attr("cy", d => yScale(d.y))
        .attr("fill", d => color(d.label))
        .on("mouseover", function (event, d) {
          // Change cursor based on whether point is selectable
          const threshold = nearestThreshold(currentLambda);
          const labels = labelsByThreshold[threshold];
          const pointIndex = points.findIndex(p => p.id === d.id);
          const clusterId = labels[pointIndex];

          d3.select(this).style("cursor", clusterId === -1 ? "default" : "pointer");
        })
        .on("mouseout", function () {
          d3.select(this).style("cursor", "pointer");
        });

      // Click handler on the zoomable group
      g.on("click", function (event) {
        // Stop propagation to prevent SVG background click handler from firing
        event.stopPropagation();

        const [mx, my] = d3.pointer(event);
        const nearest = d3.least(points, d =>
          Math.hypot(xScale(d.x) - mx, yScale(d.y) - my)
        );
        if (!nearest) return;

        // Calculate distance to nearest point to determine if we clicked on empty space
        const distanceToNearest = Math.hypot(xScale(nearest.x) - mx, yScale(nearest.y) - my);
        const clickRadius = 8; // Pixels - if click is further than this from nearest point, treat as empty space

        // If clicked on empty space, handle as background click
        if (distanceToNearest > clickRadius) {
          handleBackgroundClick();
          return;
        }

        const pointIndex = points.findIndex(p => p.id === nearest.id);
        let threshold, labels, clusterId;

        // Check if we're in expand selection mode and auto-select is enabled and clicked on a selected point
        if (autoSelectMode && expandSelectionMode) {
          const isPointSelected = g.select(`circle:nth-child(${pointIndex + 1})`).classed("selected");

          if (isPointSelected) {
            // Check if we're at the lowest water level (everything selected)
            const selectedCount = g.selectAll("circle.selected").size();
            const currentThreshold = nearestThreshold(currentLambda);
            const currentLabels = labelsByThreshold[currentThreshold];
            const totalNonNoisePoints = currentLabels.filter(label => label !== -1).length;

            if (selectedCount >= totalNonNoisePoints) {
              // At lowest water level - use original auto-select behavior
              console.log("At lowest water level - using original selection mode");
              handleAutoSelect(pointIndex, false); // false = not already selected
            } else {
              // Normal expand selection behavior
              const optimalLambda = findNextDeeperLambda(pointIndex, currentLambda);
              if (optimalLambda === null) {
                console.log("Already at deepest level for this cluster");
                return;
              }

              console.log(`Expanding selection: λ=${currentLambda.toFixed(2)} → λ=${optimalLambda.toFixed(2)}`);

              // Update the slider and current lambda
              currentLambda = optimalLambda;
              lambdaInput.value = currentLambda;
              lambdaVal.textContent = currentLambda.toFixed(1);

              // Recolor all points at the new lambda level
              recolorPoints();

              threshold = nearestThreshold(currentLambda);
              labels = labelsByThreshold[threshold];
              clusterId = labels[pointIndex];

              // Select the new cluster
              selectCluster(clusterId, labels);
            }
            return;
          }
        }

        if (autoSelectMode) {
          handleAutoSelect(pointIndex, lastSelectedPoint === pointIndex);
          return;
        } else {
          // Manual mode: reset tracking
          lastSelectedPoint = null;
          // Manual mode: use current lambda
          threshold = nearestThreshold(currentLambda);
          labels = labelsByThreshold[threshold];
          clusterId = labels[pointIndex];

          // Don't select noise points (cluster ID -1)
          if (clusterId === -1) {
            console.log("Clicked on noise point - not selectable");
            return;
          }
        }

        selectCluster(clusterId, labels);
      });

      lambdaInput.addEventListener("input", e => {
        currentLambda = parseFloat(e.target.value);
        lambdaVal.textContent = currentLambda.toFixed(1);
        recolorPoints();
      });

      // Auto-select checkbox event listener
      autoSelectCheckbox.addEventListener("change", e => {
        autoSelectMode = e.target.checked;
        lambdaInput.disabled = autoSelectMode;

        // Enable/disable expand selection checkbox based on auto-select mode
        expandSelectionCheckbox.disabled = !autoSelectMode;
        if (!autoSelectMode) {
          expandSelectionCheckbox.checked = false;
          expandSelectionMode = false;
        }

        // Reset tracking when switching modes
        lastSelectedPoint = null;

        if (autoSelectMode) {
          console.log("Auto-select mode enabled - click points to find optimal λ, click again to drill deeper");
        } else {
          console.log("Manual mode - use slider to control λ");
        }
      });

      // Expand selection checkbox event listener
      expandSelectionCheckbox.addEventListener("change", e => {
        expandSelectionMode = e.target.checked;

        if (expandSelectionMode) {
          console.log("Expand selection mode enabled - click any selected point to drill deeper");
        } else {
          console.log("Expand selection mode disabled");
        }
      });

      function handleAutoSelect(pointIndex, isAlreadySelected) {
        let optimalLambda;
        if (isAlreadySelected) {
          // Progressive drilling: find next deeper level
          optimalLambda = findNextDeeperLambda(pointIndex, currentLambda);
          if (optimalLambda === null) {
            console.log("Already at deepest level for this point");
            return;
          }
          console.log(`Drilling deeper: λ=${currentLambda.toFixed(2)} → λ=${optimalLambda.toFixed(2)}`);
        } else {
          // First selection or different point: find the highest lambda where this point is not noise
          optimalLambda = findOptimalLambda(pointIndex);
          if (optimalLambda === null) {
            console.log("Point is noise at all lambda levels");
            return;
          }
          // Reset tracking since we're selecting a different point
          lastSelectedPoint = pointIndex;
        }

        // Update the slider and current lambda
        currentLambda = optimalLambda;
        lambdaInput.value = currentLambda;
        lambdaVal.textContent = currentLambda.toFixed(1);

        // Recolor all points at the new lambda level
        recolorPoints();

        const threshold = nearestThreshold(currentLambda);
        const labels = labelsByThreshold[threshold];
        const clusterId = labels[pointIndex];

        selectCluster(clusterId, labels);
      }

      function selectCluster(clusterId, labels) {
        const clusterIndices = labels
          .map((lbl, i) => (lbl === clusterId ? i : -1))
          .filter(i => i !== -1);

        g.selectAll("circle")
          .classed("selected", (d, i) => clusterIndices.includes(i))
          .attr("stroke-width", function (d, i) {
            // Apply proper stroke width based on selection and current zoom
            const currentTransform = d3.zoomTransform(svg.node());
            const threshold = nearestThreshold(currentLambda);
            const labels = labelsByThreshold[threshold];
            const isNoise = labels && labels[i] === -1;

            // No stroke for noise points
            if (isNoise) return 0;
            return clusterIndices.includes(i) ?
              2 / currentTransform.k :
              1 / currentTransform.k;
          });

        // Update selection count
        updateSelectionCount(clusterIndices.length);
      }

      function recolorPoints() {
        const threshold = nearestThreshold(currentLambda);
        const labels = labelsByThreshold[threshold];
        g.selectAll("circle")
          .attr("fill", (d, i) => {
            const label = labels[i];
            // Make noise points (label -1) gray and semi-transparent
            if (label === -1) {
              return "#cccccc";
            }
            return color(label);
          })
          .attr("opacity", (d, i) => {
            const label = labels[i];
            // Make noise points more transparent
            return label === -1 ? 0.4 : 1.0;
          })
          .attr("stroke-width", function (d, i) {
            const currentTransform = d3.zoomTransform(svg.node());
            const label = labels[i];
            const isNoise = label === -1;

            // No stroke for noise points
            if (isNoise) return 0;
            return d3.select(this).classed("selected") ?
              2 / currentTransform.k :
              1 / currentTransform.k;
          });
      }

      function findOptimalLambda(pointIndex) {
        // Find the highest lambda where this point is not noise (-1)
        // Start from highest lambda and work down
        const thresholds = Object.keys(labelsByThreshold)
          .map(parseFloat)
          .sort((a, b) => b - a); // Sort descending (highest first)

        for (const lambda of thresholds) {
          const threshold = lambda.toFixed(2);
          const labels = labelsByThreshold[threshold];
          const clusterId = labels[pointIndex];

          if (clusterId !== -1) {
            console.log(`Found optimal λ=${lambda.toFixed(2)} for point (cluster ${clusterId})`);
            return lambda;
          }
        }

        // Point is noise at all levels
        return null;
      }

      function findNextDeeperLambda(pointIndex, currentLambda) {
        // Find the next lower lambda where the cluster containing this point gets LARGER
        // This creates a "growing cluster" effect as we lower the water level
        const thresholds = Object.keys(labelsByThreshold)
          .map(parseFloat)
          .sort((a, b) => b - a); // Sort descending (highest first)

        // Get current cluster size
        const currentThreshold = nearestThreshold(currentLambda);
        const currentLabels = labelsByThreshold[currentThreshold];
        const currentClusterId = currentLabels[pointIndex];

        if (currentClusterId === -1) {
          console.log("Current point is noise, cannot expand cluster");
          return null;
        }

        const currentClusterSize = currentLabels.filter(label => label === currentClusterId).length;
        console.log(`Current cluster size: ${currentClusterSize} points`);

        // Find thresholds lower than current lambda
        const lowerThresholds = thresholds.filter(lambda => lambda < currentLambda);

        for (const lambda of lowerThresholds) {
          const threshold = lambda.toFixed(2);
          const labels = labelsByThreshold[threshold];
          const clusterId = labels[pointIndex];

          if (clusterId !== -1) {
            // Count points in this cluster
            const clusterSize = labels.filter(label => label === clusterId).length;

            // Only return if cluster is larger than current
            if (clusterSize > currentClusterSize) {
              console.log(`Found expanded cluster: λ=${lambda.toFixed(2)}, size ${currentClusterSize} → ${clusterSize} points`);
              return lambda;
            }
          }
        }

        // No deeper level available where cluster expands
        console.log("No larger cluster found at lower lambda levels");
        return null;
      }

      function nearestThreshold(val) {
        const keys = Object.keys(labelsByThreshold).map(parseFloat);
        const closest = keys.reduce((a, b) => Math.abs(a - val) < Math.abs(b - val) ? a : b);
        return closest.toFixed(2);
      }

      recolorPoints();
    });
  </script>
</body>

</html>
